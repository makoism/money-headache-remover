# Local development and tests only: same Worker, a local D1, stand-in values.
name = "money-headache-remover-dev"
main = "../worker/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "money-vault"
database_id = "local-dev"

[vars]
ANTHROPIC_API_KEY = "test-key"
ANTHROPIC_BASE_URL = "http://127.0.0.1:8790"
IP_PER_MINUTE = "500"
USER_DAILY_CALLS = "50"
