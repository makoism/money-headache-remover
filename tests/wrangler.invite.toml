# Local tests with the invite gate on.
name = "money-headache-remover-dev2"
main = "../worker/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "money-vault"
database_id = "local-dev2"

[vars]
ANTHROPIC_API_KEY = "test-key"
ANTHROPIC_BASE_URL = "http://127.0.0.1:8790"
IP_PER_MINUTE = "500"
INVITE_CODES = "Mako Rocks, fam"
