<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the burrow (new engine, try)</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #eef4ef; --panel: rgba(255, 255, 255, .62); --card: rgba(255, 255, 255, .62); --field: #ffffff; --seg-on: #ffffff; --float: rgba(255, 255, 255, .86);
  --ink: #122018; --ink2: #3d5749; --ink3: #44594b; --hair: rgba(18, 32, 24, .1); --track: rgba(18, 32, 24, .07); --track2: rgba(18, 32, 24, .11);
  --accent: #1f7a52; --on-accent: #ffffff; --accent-h: #196744; --link: #145c3c;   /* F6: hover darker, so white text keeps 4.5:1 (was #27895d, 4.35:1) */
  --c1: #b8512e; --c2: #2c6db5; --c3: #3e8e2b; --c4: #d6568a; --c5: #d99a12; --c6: #7e3f96; --c7: #0b8fa8; --cp: #d4e04f; --cl: #b9c6d2; --cg: #e8dcc0;
  --good: #166240; --good-bg: rgba(31, 122, 82, .12); --warn: #7a5300; --warn-bg: rgba(154, 106, 0, .12); --bad: #b8352e; --bad-bg: rgba(184, 53, 46, .1); --bad-btn: #a52f28;
  --warn-on: #c98500; --bad-on: #e0524b; --ok-dot: #a9bdb2;   /* F6 (side A finding 2): --good was #1f7a52 (3.85:1 on its tint) and --warn #9a6a00 (3.48:1) as text */
  --leaf: rgba(31, 122, 82, .34); --glass-hi: rgba(255, 255, 255, .5);
  --acc-tint: rgba(31, 122, 82, .08); --acc-tint2: rgba(31, 122, 82, .2); --acc-glow: rgba(31, 122, 82, .25); --acc-ring: rgba(31, 122, 82, .65);
  --aurora: radial-gradient(60% 45% at 85% -5%, rgba(143, 217, 176, .5) 0%, rgba(143, 217, 176, 0) 70%), radial-gradient(70% 50% at -10% 60%, rgba(95, 185, 138, .22) 0%, rgba(95, 185, 138, 0) 70%), radial-gradient(50% 40% at 60% 110%, rgba(255, 255, 255, .7) 0%, rgba(255, 255, 255, 0) 70%);
  /* type: Nunito Sans for reading, Fraunces (a soft serif) for titles and the big numbers. Both are served next to the page (fonts/);
     a copy opened as a plain file falls back to the device's own fonts */
  --f: "Nunito Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", "Segoe UI", Roboto, Arial, sans-serif;
  --fd: "Fraunces", "New York", "Iowan Old Style", "Palatino", Georgia, "Hiragino Mincho ProN", "Noto Serif JP", serif;
  --fh: "Caveat", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; /* one handwritten note, from Mako */
  --gap: 40px;
  /* THE RULESET. Everything below is built from these, so one logic holds across every screen.
     Corners grow with the padding of the thing they round: controls 14 (small ones 12, tiny ones 10), boxes inside cards 18,
     panels with room in them 24, cards and sheets 28, pills 980. Cards share one padding and one distance between them.
     Type: 13 micro, 14 caption, 15 secondary, 16 controls, 17 body, 19 lead, 20 in-card heading, card title 24 to 30, page title 30 to 44. */
  --r-card: 28px; --r-panel: 24px; --r-box: 18px; --r-ctl: 14px; --r-ctl-s: 12px; --r-ctl-xs: 10px;
  --pad-card: clamp(22px, 5vw, 36px); --gap-card: 20px; --gap-sect: clamp(32px, 6vw, 44px);
  --t-micro: 13px; --t-cap: 14px; --t-sm: 15px; --t-ctl: 16px; --t-body: 17px; --t-lead: 19px; --t-h3: 20px; --t-h2: clamp(24px, 3.6vw, 30px); --t-h1: clamp(30px, 7vw, 44px);
  --ctl-h: 52px; --ctl-h-s: 46px; --btn-h: 44px; --btn-h-s: 38px; --btn-h-l: 52px; /* large: a row's main action, or a button beside a 52px field */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c1a15; --panel: rgba(255, 255, 255, .055); --card: rgba(255, 255, 255, .055); --field: rgba(0, 0, 0, .28); --seg-on: rgba(255, 255, 255, .14); --float: rgba(16, 34, 27, .78);
    --ink: #e9f3ee; --ink2: #a9c4b7; --ink3: #7f998d; --hair: rgba(255, 255, 255, .1); --track: rgba(255, 255, 255, .08); --track2: rgba(255, 255, 255, .14);
    --accent: #8fd9b0; --on-accent: #0b1813; --accent-h: #a5e4c2; --link: #9ad8b8;
    --c1: #d95926; --c2: #3987e5; --c3: #3fa03c; --c4: #d55181; --c5: #c98500; --c6: #a266c9; --c7: #1a9dad; --cp: #d4e04f; --cl: #b9c6d2; --cg: #e8dcc0;
    --good: #8fd9b0; --good-bg: rgba(143, 217, 176, .16); --warn: #e8c37a; --warn-bg: rgba(232, 195, 122, .16); --bad: #ef8f8f; --bad-bg: rgba(239, 143, 143, .16); --bad-btn: #ef8f8f;
    --warn-on: #e8c37a; --bad-on: #ef8f8f; --ok-dot: #4f6a5c;
    --leaf: rgba(143, 217, 176, .42); --glass-hi: rgba(255, 255, 255, .06);
    --acc-tint: rgba(143, 217, 176, .1); --acc-tint2: rgba(143, 217, 176, .22); --acc-glow: rgba(143, 217, 176, .28); --acc-ring: rgba(143, 217, 176, .65);
    --aurora: radial-gradient(60% 45% at 85% -5%, rgba(95, 185, 138, .26) 0%, rgba(95, 185, 138, 0) 70%), radial-gradient(70% 50% at -10% 60%, rgba(31, 107, 74, .32) 0%, rgba(31, 107, 74, 0) 70%), radial-gradient(50% 40% at 60% 110%, rgba(143, 217, 176, .12) 0%, rgba(143, 217, 176, 0) 70%);
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1a15; --panel: rgba(255, 255, 255, .055); --card: rgba(255, 255, 255, .055); --field: rgba(0, 0, 0, .28); --seg-on: rgba(255, 255, 255, .14); --float: rgba(16, 34, 27, .78);
    --ink: #e9f3ee; --ink2: #a9c4b7; --ink3: #7f998d; --hair: rgba(255, 255, 255, .1); --track: rgba(255, 255, 255, .08); --track2: rgba(255, 255, 255, .14);
    --accent: #8fd9b0; --on-accent: #0b1813; --accent-h: #a5e4c2; --link: #9ad8b8;
    --c1: #d95926; --c2: #3987e5; --c3: #3fa03c; --c4: #d55181; --c5: #c98500; --c6: #a266c9; --c7: #1a9dad; --cp: #d4e04f; --cl: #b9c6d2; --cg: #e8dcc0;
    --good: #8fd9b0; --good-bg: rgba(143, 217, 176, .16); --warn: #e8c37a; --warn-bg: rgba(232, 195, 122, .16); --bad: #ef8f8f; --bad-bg: rgba(239, 143, 143, .16); --bad-btn: #ef8f8f;
    --warn-on: #e8c37a; --bad-on: #ef8f8f; --ok-dot: #4f6a5c;
    --leaf: rgba(143, 217, 176, .42); --glass-hi: rgba(255, 255, 255, .06);
    --acc-tint: rgba(143, 217, 176, .1); --acc-tint2: rgba(143, 217, 176, .22); --acc-glow: rgba(143, 217, 176, .28); --acc-ring: rgba(143, 217, 176, .65);
    --aurora: radial-gradient(60% 45% at 85% -5%, rgba(95, 185, 138, .26) 0%, rgba(95, 185, 138, 0) 70%), radial-gradient(70% 50% at -10% 60%, rgba(31, 107, 74, .32) 0%, rgba(31, 107, 74, 0) 70%), radial-gradient(50% 40% at 60% 110%, rgba(143, 217, 176, .12) 0%, rgba(143, 217, 176, 0) 70%);
}
:root { --streak: #1f7a52; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --streak: #8fd9b0; } }
:root[data-theme="dark"] { --streak: #8fd9b0; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.tab-in { animation: tabIn .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } }
.tour-tools { display: inline-flex; align-items: center; gap: 18px; }
.plan-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 30px; }
.plan-top h2 { font-size: var(--t-h2); font-weight: 500; letter-spacing: -.012em; }
#p-month .hero { padding-top: 30px; }
.ctext summary { cursor: pointer; color: var(--link); font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; }
.ctext { display: grid; gap: 12px; }
.ctext textarea { width: 100%; border: 0; border-radius: var(--r-ctl); background: var(--field); box-shadow: inset 0 0 0 1px var(--hair); padding: 12px 14px; font-size: 15px; resize: none; }
.cal-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.cal-btns .btn.cal { display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; min-height: var(--btn-h-l); font-size: 15px; padding: 0 12px; }
.cal-msg { font-size: 14px; color: var(--ink2); }
.cal-msg:empty { display: none; }

/* ---------- Home ---------- */
.hnext { margin-top: var(--gap-card); display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 16px 20px; border-radius: var(--r-panel); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent); }
.hn-t { display: grid; gap: 2px; min-width: 0; flex: 1 1 260px; }
.hn-t b { font-size: 17px; } .hn-t span { font-size: 15px; color: var(--ink2); line-height: 1.35; }
.hn-b { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hn-b select.inp.sm { display: inline-block; flex: none; width: auto; min-width: 0; min-height: 34px; padding: 4px 30px 4px 12px; font-size: 15px; border-radius: var(--r-ctl-xs); -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.hq { display: grid; gap: 18px; }
.hform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) auto; gap: 14px; align-items: end; }
.hform .hadd { min-height: var(--btn-h-l); padding: 0 30px; }
.hform .field > label { font-size: 14px; }
.hform .selbox select { width: 100%; min-height: 52px; }
.hmore { grid-column: 1 / -1; }
.hmore summary { cursor: pointer; color: var(--link); font-size: 15px; min-height: 32px; display: inline-flex; align-items: center; list-style: none; }
.hmore summary::-webkit-details-marker { display: none; }
.hmore-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 14px; padding-top: 12px; }
.hmsg { grid-column: 1 / -1; min-height: 1.3em; margin-top: -6px; }
@media (max-width: 560px) { .hform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .hform .hadd { grid-column: 1 / -1; } .hmore-in { grid-template-columns: 1fr; } }

.hwin .hw-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(16px, 4vw, 28px); align-items: center; }
.hw-n { display: grid; justify-items: center; min-width: 84px; }
.hw-n b { font-size: clamp(66px, 15vw, 100px); line-height: .88; font-weight: 600; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
.hw-n b svg { width: 76px; height: 76px; color: var(--good); }
.hw-n span { font-size: 14px; color: var(--ink2); font-weight: 500; margin-top: 8px; text-align: center; }
#p-home .hw-t h2 { font-size: clamp(20px, 3.3vw, 26px); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; }
#p-home .hw-t h2 b { font-weight: 600; }
.hw-sub { color: var(--ink2); font-size: 16px; margin-top: 6px; text-wrap: pretty; }
.hw-t .chip { margin-top: 12px; }
.hw-bar { position: relative; height: 12px; border-radius: 6px; background: var(--track2); margin-top: 26px; }
.hw-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--c); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.hw-bar .ms { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--panel); border-radius: 2px; }
.hw-nums { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; color: var(--ink2); }
.hw-add { margin: 6px 0 0; font-size: 15px; color: var(--ink2); } .hw-add b { color: var(--ink); font-weight: 600; }
.hw-nums b { color: var(--ink); font-weight: 600; }
.hw-graph { margin-top: 18px; }
.hw-graph svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.hg-g { stroke: var(--hair); stroke-width: 1; }
.hg-t { stroke: var(--ink3); stroke-width: 1.25; stroke-dasharray: 4 5; }
.hg-d { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 2 4; opacity: .8; }
.hg-a { fill: var(--c); opacity: .15; }
.hg-l { fill: none; stroke: var(--c); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.hg-l.draw { stroke-dasharray: 1600; animation: hgDraw 1.2s cubic-bezier(.3, .7, .2, 1) both; }
@keyframes hgDraw { from { stroke-dashoffset: 1600; } to { stroke-dashoffset: 0; } }
.hg-p { fill: var(--c); stroke: var(--panel); stroke-width: 3; }
.hg-x { fill: var(--ink2); font-size: var(--t-micro); font-family: var(--f); letter-spacing: 0; }
.hw-empty { display: grid; gap: 14px; justify-items: start; }
.hw-empty p { color: var(--ink2); max-width: 40ch; }
.hwin .row-btns { margin-top: 18px; }

.hpair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap-card); margin-top: var(--gap-card); }
#p-home .hpair .card { margin-top: 0; }
@media (max-width: 640px) { .hpair { grid-template-columns: 1fr; } }
.hs-big { font-size: min(clamp(42px, 8vw, 56px), calc((100vw - 90px) / (var(--n, 6) * .62))); font-weight: 500; letter-spacing: -.02em; line-height: 1; margin-top: 16px; font-variant-numeric: tabular-nums; }
.hs-big.neg { color: var(--bad); }
.hs-lbl { color: var(--ink2); font-size: 15px; margin-top: 6px; }
.hs-bar { position: relative; height: 10px; border-radius: 5px; background: var(--track2); margin-top: 18px; }
.hs-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--c5); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.hs-bar.over i { background: var(--bad); }
.hs-bar .pace { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .45; border-radius: 1px; }
.hs-sub { font-size: 15px; color: var(--ink2); margin-top: 12px; line-height: 1.4; }
.hs-sub b { color: var(--ink); font-weight: 600; }
.hspend .chip { margin-top: 10px; font-size: 14px; padding: 5px 13px 5px 10px; }
.hst-top { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.hst-fl { width: 54px; height: 54px; color: var(--hair); flex: none; transform-origin: 50% 90%; }
.hst-fl svg { width: 100%; height: 100%; display: block; }
.hst-fl.lit { color: var(--streak); animation: sway 2.6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: scale(1.04) rotate(4deg); } }
.hst-n { display: flex; align-items: baseline; gap: 8px; }
.hst-n b { font-size: 58px; line-height: 1; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hst-n span { font-size: 17px; color: var(--ink2); }
.hst-line { font-size: 15px; color: var(--ink2); margin-top: 10px; line-height: 1.4; }
.wdots { list-style: none; display: flex; gap: 7px; margin: 16px 0 0; padding: 0; }
.wd { flex: 1 1 0; max-width: 36px; aspect-ratio: 1; border-radius: 50%; background: var(--track2); display: grid; place-items: center; }
.wd-i { display: grid; width: 62%; height: 62%; }
.wd-i svg { width: 100%; height: 100%; display: block; }
.wd.done { background: color-mix(in srgb, var(--streak) 22%, var(--panel)); color: var(--streak); }
.wd.shield { background: color-mix(in srgb, var(--accent) 18%, var(--panel)); color: var(--accent); }
.wd.miss { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); }
.wd.now { background: transparent; box-shadow: inset 0 0 0 2px var(--streak); }
.wd.none { opacity: .55; }
.hst-sh { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); margin-top: 14px; line-height: 1.3; }
.hst-sh svg { width: 20px; height: 20px; color: var(--ink3); flex: none; }
.hst-sh.on svg { color: var(--accent); } .hst-sh.on span { color: var(--ink); font-weight: 500; }
.hstreak .row-btns { margin-top: 16px; }
.hst-best { font-size: 14px; color: var(--ink2); }

.gg { margin-top: 18px; }
.gg svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.gg-g { stroke: var(--hair); stroke-width: 1; }
.gg-t { stroke: var(--ink3); stroke-width: 1.25; stroke-dasharray: 4 5; }
.gg-l { fill: none; stroke: var(--c); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.gg-l.draw { stroke-dasharray: 1600; animation: hgDraw 1.2s cubic-bezier(.3, .7, .2, 1) both; }
.gg-p { fill: var(--c); stroke: var(--panel); stroke-width: 3; }
.gg-c { stroke: var(--ink3); stroke-width: 1; }
.gg-x { fill: var(--ink2); font-size: var(--t-micro); font-family: var(--f); }
.hgl-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hgl { display: grid; gap: 12px; margin-top: 18px; }
.hg { display: grid; gap: 10px; text-align: left; border: 0; background: var(--field); border-radius: var(--r-box); padding: 16px 18px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--hair); transition: transform .15s, box-shadow .15s; width: 100%; }
.hg:hover { box-shadow: inset 0 0 0 1px var(--ink3); } .hg:active { transform: scale(.992); }
.hg-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hg-h .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.hg-h b { font-size: 17px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
.hg-h em { font-style: normal; font-size: 13px; font-weight: 600; border-radius: 980px; padding: 2px 10px; background: var(--track2); color: var(--ink2); flex: none; }
.hg-h em.good { background: var(--good-bg); color: var(--good); } .hg-h em.warn { background: var(--warn-bg); color: var(--warn); }
.hg-b { display: block; position: relative; height: 8px; border-radius: 4px; background: var(--track2); }
.hg-b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--c); }
.hg-f { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.hbs { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; margin: 18px 0 0; padding: 0; }
.hb { display: grid; gap: 3px; justify-items: start; align-content: start; background: var(--field); border-radius: var(--r-box); padding: 14px; box-shadow: inset 0 0 0 1px var(--hair); }
.hb-i { width: 32px; height: 32px; color: var(--ink3); opacity: .6; margin-bottom: 4px; display: block; }
.hb-i svg { width: 100%; height: 100%; display: block; }
.hb b { font-size: 15px; font-weight: 600; } .hb span:last-child { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.hb.on .hb-i { color: var(--streak); opacity: 1; } .hb:not(.on) b { color: var(--ink2); }
.hb-n { font-size: 14px; color: var(--ink2); }
.hdeep-l { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* ---------- date and month pickers ---------- */
.dp-native { position: absolute !important; width: 1px !important; height: 1px !important; opacity: 0 !important; pointer-events: none !important; overflow: hidden; clip-path: inset(50%); }
.dp-hide { display: none !important; }
.dpb { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: var(--ctl-h); padding: 0 16px; border: 0; border-radius: var(--r-ctl); background: var(--field); box-shadow: inset 0 0 0 1px var(--hair); font-weight: 500; font-size: 17px; text-align: left; cursor: pointer; color: var(--ink); transition: box-shadow .15s; }
.dpb svg { color: var(--ink3); flex: none; }
.dpb:hover { box-shadow: inset 0 0 0 1px var(--ink3); }
.dpb:focus-visible, .dpb.open { outline: none; box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.dpb:disabled { opacity: .5; cursor: default; }
.dp-pick.open .pick-t { background: var(--track); }
.dp { position: fixed; z-index: 120; width: 308px; max-width: calc(100vw - 20px); background: var(--float); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); color: var(--ink); border-radius: var(--r-panel); padding: 10px 10px 8px; box-shadow: 0 26px 64px -14px rgba(0, 0, 0, .42), 0 0 0 .5px var(--hair); opacity: 0; transform: scale(.94) translateY(-4px); transition: opacity .12s ease-out, transform .17s cubic-bezier(.2, .9, .3, 1.15); will-change: transform, opacity; user-select: none; -webkit-user-select: none; letter-spacing: -.01em; }
.dp.in { opacity: 1; transform: none; }

.dp-n:hover { background: var(--track); } .dp-n:active { transform: scale(.92); }
.dp-w { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--ink3); padding-bottom: 4px; }
.dp-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }
.dp-g button { height: 40px; border: 0; background: none; border-radius: 50%; font-size: 16px; cursor: pointer; font-variant-numeric: tabular-nums; transition: background .1s, color .1s, transform .1s; color: var(--ink); }
.dp-g button:hover:not(:disabled):not(.on) { background: var(--track); }

.dp-g.sl-l { animation: dpL .17s ease-out; } .dp-g.sl-r { animation: dpR .17s ease-out; }
@keyframes dpL { from { opacity: 0; transform: translateX(16px); } } @keyframes dpR { from { opacity: 0; transform: translateX(-16px); } }

.dp-l { border: 0; background: none; color: var(--link); font-size: 15px; padding: 8px 10px; border-radius: var(--r-ctl-xs); cursor: pointer; } .dp-l:hover { background: var(--track); }
.dp-mg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

.dp-mg button:hover:not(:disabled):not(.on) { background: var(--track); }
.dp-mg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; } .dp-mg button.today:not(.on) { color: var(--accent); font-weight: 600; } .dp-mg button:disabled { opacity: .25; }
.dp-month { width: 292px; max-height: min(430px, 72vh); overflow-y: auto; overscroll-behavior: contain; }
.dp-y b { display: block; font-size: 14px; color: var(--ink2); padding: 10px 6px 6px; font-weight: 600; }

.dp-none:hover { background: var(--track); } .dp-none.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* ---------- add a goal ---------- */
.gw { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; }
.gw-scrim { position: absolute; inset: 0; background: rgba(8, 10, 16, .5); opacity: 0; transition: opacity .2s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.gw.on .gw-scrim { opacity: 1; }
.gw-card { position: relative; width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--panel); border-radius: var(--r-card); padding: 22px 26px 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .55); transform: translateY(26px) scale(.98); opacity: 0; transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .2s; }
.gw.on .gw-card { transform: none; opacity: 1; }
.gw-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gw-dots { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.gw-dots li { width: 30px; height: 5px; border-radius: 3px; background: var(--track2); transition: background .25s; }
.gw-dots li.done, .gw-dots li.on { background: var(--accent); } .gw-dots li.done { opacity: .5; }
.gw-card h2 { font-size: var(--t-h2); line-height: 1.12; font-weight: 500; letter-spacing: -.012em; margin: 20px 0 18px; }
.gw-body { display: grid; gap: 18px; }
.in-r { animation: slideR .26s cubic-bezier(.2, .8, .2, 1); } .in-l { animation: slideL .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideR { from { opacity: 0; transform: translateX(28px); } } @keyframes slideL { from { opacity: 0; transform: translateX(-28px); } }
.gw-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gw-chip { text-align: left; border: 0; background: var(--field); border-radius: var(--r-box); padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--hair); min-height: 66px; align-content: center; transition: box-shadow .15s, transform .12s; }
.gw-chip:active { transform: scale(.97); }
.gw-chip b { font-size: 17px; font-weight: 600; letter-spacing: -.015em; } .gw-chip span { font-size: 13px; color: var(--ink2); line-height: 1.25; }
.gw-chip.on { box-shadow: inset 0 0 0 2px var(--accent); }
.gw-quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 0; background: var(--track); border-radius: 980px; min-height: 38px; padding: 0 16px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s, transform .1s; color: var(--ink); }
.chipbtn:active { transform: scale(.96); } .chipbtn.on { background: var(--accent); color: var(--on-accent); }
.gw-plan { font-size: 17px; background: var(--field); padding: 14px 16px; border-radius: var(--r-box); line-height: 1.4; min-height: 3.3em; box-shadow: inset 0 0 0 1px var(--hair); }
.gw-plan b { font-weight: 600; } .gw-plan.bad { color: var(--bad); }
.gw-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.gw .btn.dim { opacity: .55; } .gw-hint { margin: 14px 0 -10px; min-height: 0; color: var(--warn); } .gw-hint:empty { display: none; }
.gw-foot .btn { min-width: 124px; }
body.gw-open, body.co-open.gw-open { overflow: hidden; }
@media (max-width: 560px) { .gw { align-items: end; padding: 0; } .gw-card { border-radius: var(--r-card) var(--r-card) 0 0; width: 100%; max-height: 92dvh; padding-bottom: max(24px, env(safe-area-inset-bottom)); } .gw-chips { grid-template-columns: 1fr 1fr; } }

/* ---------- coach marks ---------- */
.co { position: fixed; inset: 0; z-index: 110; }
.co-block { position: absolute; inset: 0; }
.co-hole { position: absolute; border-radius: var(--r-box); box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 0 0 9999px rgba(8, 10, 18, .6); pointer-events: none; opacity: 0; transition: opacity .2s; }

.co.mv .co-hole { transition: opacity .2s, left .3s cubic-bezier(.3, .8, .2, 1), top .3s cubic-bezier(.3, .8, .2, 1), width .3s cubic-bezier(.3, .8, .2, 1), height .3s cubic-bezier(.3, .8, .2, 1); }
.co-pop { position: absolute; width: min(364px, calc(100vw - 24px)); background: var(--float); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); color: var(--ink); border-radius: var(--r-panel); padding: 18px 20px 14px; box-shadow: 0 28px 70px -16px rgba(0, 0, 0, .55); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .22s cubic-bezier(.2, .9, .3, 1); }
.co.on .co-pop { opacity: 1; transform: none; }

.co-pop.swap h2, .co-pop.swap #coB, .co-pop.swap .co-n { animation: coFade .24s ease-out; }
@keyframes coFade { from { opacity: 0; transform: translateY(4px); } }
.co-n { font-size: 13px; color: var(--ink3); font-weight: 600; }
.co-pop h2 { font-size: 22px; font-weight: 500; letter-spacing: -.008em; margin: 4px 0 6px; line-height: 1.2; }
.co-pop #coB { font-size: 16px; color: var(--ink2); line-height: 1.4; }
.co-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.co-arrow { position: absolute; width: 14px; height: 14px; background: var(--float); transform: rotate(45deg); border-radius: 3px; }
.co-arrow.up { top: -6px; } .co-arrow.down { bottom: -6px; }
.co-pop.sheet { border-radius: var(--r-card); }

/* ---------- Ask Claude states ---------- */
.ask-state { padding: 22px 18px; display: grid; gap: 14px; font-size: 16px; color: var(--ink2); line-height: 1.45; }
.ask-state[hidden] { display: none; }
.inv-row { margin-top: 8px; }
.tour-restore { margin-top: -4px; }
/* setup from statements */
.src-panel, .src-how { max-width: 640px; }
.src-panel { margin: 0 0 12px; padding: 12px 14px; border-radius: var(--r-box); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
/* the statements field: one calm box with the arrow, the button and the file types; once files are in it folds to a row */
.src-panel.drop { position: relative; overflow: hidden; border-radius: var(--r-card); padding: 14px 16px 16px; margin-top: 36px; }
.drop-in { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; min-height: 268px; padding: 18px 0 30px; }
.drop-arrow { width: 56px; height: 56px; color: var(--accent); }
.drop-t { font-size: 15px; color: var(--ink2); }
.drop-sub.cap { margin: 0; font-size: 13px; color: var(--ink3); }
.drop.has .drop-in { flex-direction: row; min-height: 0; padding: 4px 0 8px; gap: 12px; justify-content: flex-start; text-align: left; flex-wrap: wrap; }
.drop.has .drop-arrow, .drop.has .drop-t { display: none; } .drop.has .drop-in .btn { min-height: 38px; padding: 0 18px; font-size: 15px; }
.drop .art-grass { left: 30px; bottom: -2px; width: 132px; opacity: .9; } .drop.has .art-grass { display: none; }
/* one box per account: its kind, its name, its own drop field. With a file in, the field folds to a row and the box stays compact */
.accts { display: grid; gap: 12px; max-width: 640px; }
.src-panel.drop.acct { margin: 0; }
.acct .drop-in { min-height: 176px; padding: 10px 0 26px; }
.acct-h { display: grid; gap: 10px; }
.acct-h .tour-chips.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.acct-h .kinds .chip { min-height: 36px; padding: 0 14px; border-radius: var(--r-ctl-xs); } .acct-h .kinds .chip b { font-size: 15px; font-weight: 500; }
.acct-name.inp.sm { min-height: 44px; } .acct-name input { font-size: 17px; font-weight: 500; }
.acct-rm.link { justify-self: start; font-size: 14px; color: var(--ink3); padding: 6px 0 2px; }
.acct.drop.has .drop-in { padding: 6px 0 4px; }
@media (min-width: 520px) { .acct-h { grid-template-columns: auto minmax(0, 1fr); align-items: center; } }
/* the review: files listed under their account */
.imp-files .imp-acct > ul { margin: 2px 0 6px 14px; padding: 0; } .imp-files .imp-acct > ul li { font-size: 13px; color: var(--ink3); }
/* a receipt's account, as the person named it */
.rc-acct { color: var(--ink3); } .rc-acct::before { content: '· '; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.src-panel .fchips { margin: 10px 0 2px; }
.src-panel .cap { margin: 8px 0 0; max-width: none; }
.src-panel .row-btns .cap { margin: 0; }
.src-here { margin: 0 0 12px !important; }
.note-line { display: block; margin-top: 6px; line-height: 1.4; }
.note-line:first-child { margin-top: 0; }
.note-line a { color: var(--accent); }
.src-panel textarea { width: 100%; min-height: 84px; margin-top: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-ctl); background: var(--field); padding: 10px 12px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; color: inherit; }
.src-how { margin: 4px 0 10px; } .src-how summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.src-how-in p { font-size: 14px; color: var(--ink2); margin: 8px 0 0; }
/* the own-AI route inside the fold: one column, full-width paste box, the same gaps as the rest */
.src-how-in { display: grid; gap: 12px; padding: 4px 0 6px; }
.src-how-in > p { margin: 0; }
.src-how-in #impPaste { width: 100%; min-height: 110px; margin: 0; border: 0; box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-ctl); background: var(--field); padding: 12px 14px; font: inherit; font-size: 15px; color: inherit; resize: vertical; }
.src-how-in #impPaste:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.ai-apps { gap: 8px; }
.jar-lines { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-width: 520px; }
.jar-lines li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--ink2); }
.jar-lines li b { color: var(--ink); font-weight: 600; }
.jar-lines .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 5px; flex: none; }
.imp-out .msg { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--panel); font-size: 14px; white-space: pre-wrap; }
.imp-out .msg.wait { color: var(--ink2); }
.imp-list { display: grid; gap: 6px; margin: 8px 0 10px; }
.imp-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-ctl); background: var(--panel); box-shadow: inset 0 0 0 1px var(--hair); opacity: .62; }
.imp-row.on { opacity: 1; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, var(--hair)); }
.imp-ck { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; cursor: pointer; }
.imp-ck input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.imp-l { display: grid; min-width: 0; } .imp-l b { font-weight: 600; font-size: 15px; } .imp-l small { color: var(--ink2); font-size: var(--t-micro); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imp-row .inp.sm { flex: 0 0 128px; }
.imp-qs { display: grid; gap: 8px; margin: 6px 0 12px; }
.imp-q { padding: 10px 12px; border-radius: var(--r-ctl); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.imp-q p { margin: 0 0 6px; font-size: 15px; }
.imp-q .tour-chips { margin: 0; }
.tour-restore-in { margin: 4px 0 10px; }
.vault-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; letter-spacing: .04em; font-weight: 600; user-select: all; -webkit-user-select: all; margin: 10px 0 4px; word-break: break-all; }
.inv-row input.txt { flex: 1 1 140px; min-height: 40px; border: 0; box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-ctl-xs); background: var(--field); padding: 0 12px; font: inherit; color: inherit; outline: none; }

/* ---------- setup extras ---------- */
.spk { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; background: var(--c); clip-path: path('M7 0 Q14 7 7 14 Q0 7 7 0 Z'); opacity: 0; animation: spk .85s ease-out var(--d) forwards; z-index: 3; }
@keyframes spk { 0% { transform: translate(0, 0) scale(0) rotate(0); opacity: 1; } 25% { opacity: 1; transform: translate(calc(var(--dx) * .4), calc(var(--dy) * .4)) scale(var(--s)) rotate(calc(var(--r) * .3)); } 100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--r)); opacity: 0; } }
.rng { position: relative; }
.split { display: grid; gap: 14px; max-width: 460px; }
.split-row { display: grid; gap: 4px; padding: 10px 12px; margin: 0 -12px; border-radius: var(--r-box); transition: background .4s; }
.split-row.moved { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.split-h { display: flex; align-items: center; gap: 10px; }

.split-h .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.dlt { font-size: 13px; font-weight: 600; min-width: 3.4ch; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
.dlt.up { color: var(--good); } .dlt.down { color: var(--warn); }
.pctp { display: inline-flex; align-items: center; gap: 1px; background: var(--field); border-radius: var(--r-ctl-xs); box-shadow: inset 0 0 0 1px var(--hair); padding: 0 9px 0 10px; min-height: 40px; cursor: text; transition: box-shadow .15s; flex: none; }
.pctp input { width: 3.2ch; border: 0; background: none; text-align: right; font-weight: 600; font-size: 17px; outline: none; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; padding: 0; }
.pctp input::-webkit-outer-spin-button, .pctp input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.pctp b { font-weight: 600; color: var(--ink2); font-size: 16px; }
.pctp svg { width: 14px; height: 14px; color: var(--ink3); margin-left: 5px; }
.pctp:focus-within { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.pctp.bump { animation: bump .32s ease-out; }
@keyframes bump { 40% { transform: scale(1.14); } }
.pot { display: flex; height: 28px; border-radius: var(--r-ctl); overflow: hidden; gap: 2px; background: var(--track2); max-width: 460px; }
.pot i { display: block; min-width: 0; transition: flex-grow .35s cubic-bezier(.3, .8, .2, 1); }
.why { font-size: 15px; color: var(--ink2); line-height: 1.4; background: var(--panel); padding: 12px 14px; border-radius: var(--r-ctl); max-width: 460px; min-height: 3.4em; }
.why b { color: var(--ink); font-weight: 600; }
.sw { position: relative; width: 58px; height: 36px; border: 0; border-radius: 18px; background: var(--track2); cursor: pointer; transition: background .2s; padding: 0; flex: none; }
.sw i { position: absolute; left: 3px; top: 3px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform .24s cubic-bezier(.3, 1.4, .4, 1); }
.sw[aria-checked="true"] { background: #34c759; } .sw[aria-checked="true"] i { transform: translateX(22px); }
.sw.zap i { animation: swZap .45s ease-out; } @keyframes swZap { 40% { transform: translateX(11px) scale(1.2); } }
.loan-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; max-width: 460px; }
.loan-tg { position: relative; display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.lt { font-size: 16px; font-weight: 500; color: var(--ink3); transition: color .2s; cursor: pointer; }
.lt.on { color: var(--ink); font-weight: 600; }
.loan-fields { display: grid; gap: 22px; }
.loan-fields .lf { min-width: 0; }
.loan-fields .lf[data-lf="name"] { order: 1; } .loan-fields .lf[data-lf="month"] { order: 2; } .loan-fields .lf[data-lf="total"] { order: 3; } .loan-fields .lf:not([data-lf]) { order: 4; } .loan-fields > .cap { order: 5; }
.loan-fields.m-tot .lf[data-lf="total"] { order: 2; } .loan-fields.m-tot .lf[data-lf="month"] { order: 3; }
.loan-fields.m-month .lf[data-lf="month"] .inp, .loan-fields.m-tot .lf[data-lf="total"] .inp { box-shadow: inset 0 0 0 1.5px var(--accent); }
.tour-chips .chip.on { background: var(--field); }

/* the transcript under the hello video */
.tx { max-width: 560px; margin-top: 18px; }
.tx-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; min-height: 32px; }
.tx-h b { font-size: 15px; color: var(--ink2); font-weight: 600; }
.tx-list { position: relative; height: 232px; overflow-y: auto; scrollbar-width: none; padding: 8px 0 130px; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 78%, transparent 100%); }
.tx-list::-webkit-scrollbar { display: none; }
.tx-l { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 4px; font-size: clamp(20px, 3.6vw, 24px); line-height: 1.27; font-weight: 650; letter-spacing: -.022em; color: var(--ink); opacity: .3; cursor: pointer; transition: opacity .35s, transform .35s cubic-bezier(.2, .8, .2, 1); transform-origin: left center; border-radius: 8px; }

/* ---------- the layered world (vista.js) ---------- */

#vista .vsway { animation: vsway 14s ease-in-out infinite alternate; will-change: transform; }
@keyframes vsway { from { transform: translate3d(calc(var(--sw) * -1), 0, 0); } to { transform: translate3d(var(--sw), 0, 0); } }
#vista .vlight { mix-blend-mode: screen; }
#vista .vglow { display: block; image-rendering: auto; }
#vista .vrays { position: absolute; inset: 0; }

@keyframes vray { from { opacity: .55; } to { opacity: 1; } }
#vista .vwx { position: absolute; inset: 0; overflow: hidden; }
@keyframes vfall { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, var(--th), 0); } }
@keyframes vrise { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, calc(var(--th) * -1), 0); } }
#vista .vvig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(4, 10, 12, .5) 100%); }
@media (prefers-reduced-motion: reduce) { #vista .vsway, #vista .vrays i { animation: none; } }

/* the title and save line sit on bright scenes by day: give them a soft shade so they stay readable */
body.shroom-menu header.top h1, body.shroom-menu header.top .save { text-shadow: 0 1px 3px rgba(4,20,16,.85), 0 0 10px rgba(4,20,16,.6); }

/* phones: the Close button stays in reach however far the page is scrolled, and buttons are finger sized */
@media (max-width: 560px) { body.world:not(.shut) .scroll-x { position: fixed; top: 10px; right: 12px; min-height: 44px; z-index: 80; } }
@media (pointer: coarse) { body.world .scroll button, body.world .scroll .btn, body.world .scroll summary { min-height: 44px; } }

/* the forest is only the background behind the plain app: a soft dark band behind the page column keeps the words readable, the sides stay bright */
body.shroom-menu:not(.world) #vista::after { content: ''; position: absolute; inset: 0; z-index: 99999; pointer-events: none; background: linear-gradient(90deg, rgba(3, 14, 18, .04) 0, rgba(3, 14, 18, .1) 16%, rgba(3, 14, 18, .72) 26%, rgba(3, 14, 18, .8) 50%, rgba(3, 14, 18, .72) 74%, rgba(3, 14, 18, .1) 84%, rgba(3, 14, 18, .04) 100%); }
@media (max-width: 900px) { body.shroom-menu:not(.world) #vista::after { background: rgba(3, 14, 18, .66); } }

/* ---------- the garden (garden.js): vines and small things grown into every box ---------- */
.wrap, .wrap > [role=tabpanel], .scroll > [role=tabpanel] { position: relative; }
.gnl { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2; }
.gdh { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.gv, .gi { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; filter: drop-shadow(0 2px 1.5px rgba(0, 0, 0, .4)); }
.gi { background-size: 100% 100%; background-repeat: no-repeat; pointer-events: auto; cursor: pointer; transform-origin: 50% 100%; -webkit-tap-highlight-color: transparent; }
.gi .pix { display: block; width: 100%; height: 100%; } .gi .pix svg { width: 100%; height: 100%; }
.gdh:not(.in) .gv-top, .gdh:not(.in) .gv-bottom { clip-path: inset(0 100% 0 0); } .gdh:not(.in) .gv-left, .gdh:not(.in) .gv-right { clip-path: inset(0 0 100% 0); }
.gdh.in .gv { clip-path: inset(0); transition: clip-path 1.4s steps(40) var(--d, 0ms); }
.gdh:not(.in) .gi { transform: scale(.1); opacity: 0; }
.gdh.in .gi { transition: transform .55s cubic-bezier(.3, 1.7, .5, 1) calc(var(--d, 0ms) + 350ms), opacity .25s linear calc(var(--d, 0ms) + 350ms); }
.gi.act.gi-hop { animation: gHop .5s ease-out 2; } .gi.act.gi-fly { animation: gFly 1.2s ease-in-out; } .gi.act.gi-sway { animation: gSway .9s ease-in-out; } .gi.act.gi-pop { animation: gPop .5s ease-out; }
@keyframes gHop { 40% { transform: translateY(-9px); } 100% { transform: none; } }
@keyframes gFly { 35% { transform: translate(14px, -22px) rotate(8deg); } 70% { transform: translate(-6px, -12px) rotate(-6deg); } 100% { transform: none; } }
@keyframes gSway { 25% { transform: rotate(-9deg); } 55% { transform: rotate(7deg); } 80% { transform: rotate(-3deg); } 100% { transform: none; } }
@keyframes gPop { 45% { transform: scale(1.4); } 100% { transform: none; } }
.gheart { position: absolute; width: 14px; height: 14px; background-size: 100% 100%; image-rendering: pixelated; pointer-events: none; animation: gRise 1.2s ease-out forwards; }
@keyframes gRise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gdh .gv, .gdh .gi { transition: none !important; animation: none !important; } }

.card .art:not(.art-corner) { display: none; } /* the line art is replaced by the garden */

/* ---------- v38.6: deep lush green: darker glass, deeper page, a green shade over the scenery ---------- */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #06130d; --panel: rgba(6, 36, 24, .86); --card: rgba(6, 36, 24, .86); --field: rgba(0, 14, 8, .42); --seg-on: rgba(120, 210, 160, .17); --float: rgba(5, 27, 18, .9); --hair: rgba(150, 230, 185, .14); --track: rgba(150, 230, 185, .1); --track2: rgba(150, 230, 185, .2); --glass-hi: rgba(170, 240, 200, .06); } }
:root[data-theme="dark"] { --bg: #06130d; --panel: rgba(6, 36, 24, .86); --card: rgba(6, 36, 24, .86); --field: rgba(0, 14, 8, .42); --seg-on: rgba(120, 210, 160, .17); --float: rgba(5, 27, 18, .9); --hair: rgba(150, 230, 185, .14); --track: rgba(150, 230, 185, .1); --track2: rgba(150, 230, 185, .2); --glass-hi: rgba(170, 240, 200, .06); }
body.scene-on::after { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, rgba(2, 24, 14, .22), rgba(1, 16, 9, .52)); }
/* ---------- v38.7: the green shade over the scenery follows the light: open by day, deeper at dusk and night ---------- */
:root[data-tod="day"] body.scene-on::after { background: radial-gradient(120% 90% at 50% 45%, rgba(2, 24, 14, 0), rgba(1, 16, 9, .16)); }
:root[data-tod="morning"] body.scene-on::after { background: radial-gradient(120% 90% at 50% 45%, rgba(2, 24, 14, 0), rgba(1, 16, 9, .2)); }
:root[data-tod="sunset"] body.scene-on::after { background: radial-gradient(120% 90% at 50% 45%, rgba(8, 14, 20, .08), rgba(6, 10, 18, .36)); }
/* ---------- v38.9: tapping a vine grows it ---------- */
.gv.gv-grow-h { animation: gGrowH .9s steps(24) both; } .gv.gv-grow-v { animation: gGrowV .9s steps(24) both; } .gv.gv-sway { animation: gVSway .8s ease-in-out; }
@keyframes gGrowH { from { clip-path: inset(0 var(--cl, 60%) 0 0); } to { clip-path: inset(0); } }
@keyframes gGrowV { from { clip-path: inset(0 0 var(--cl, 60%) 0); } to { clip-path: inset(0); } }
@keyframes gVSway { 30% { transform: rotate(1.2deg); } 65% { transform: rotate(-.8deg); } 100% { transform: none; } }
.gpetal { position: absolute; width: 5px; height: 5px; image-rendering: pixelated; pointer-events: none; animation: gPetal 1.3s ease-in forwards; }
@keyframes gPetal { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx, 0), 30px) rotate(160deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gv.gv-grow-h, .gv.gv-grow-v, .gv.gv-sway, .gpetal { animation: none !important; } }

/* ---- burrow screen ---- */

.bv-pop { position: absolute; width: min(86vw, 270px); padding: 16px 18px; border-radius: var(--r-panel); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); color: var(--ink); pointer-events: auto; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .45); }

.bv-s { margin: 6px 0 12px; font-size: 13px; opacity: .8; }
.bv-dots { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; pointer-events: auto; }

/* ---- Home: the burrows ---- */
.hbur { margin-top: var(--gap-card); }

.hb-scene { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; padding: 22px 10px 14px; border-radius: var(--r-panel); background: radial-gradient(120% 70% at 50% 100%, #1d4a34 0%, rgba(29, 74, 52, 0) 60%), linear-gradient(#0d2326, #11332a 72%, #0b2216); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }

.hb-b:hover, .hb-b:focus-visible { background: rgba(255, 255, 255, .07); }
.hb-b canvas { width: 120px; height: 90px; image-rendering: pixelated; } /* 40 x 30 art pixels at exactly 3x, so every pixel is sharp */

@media (max-width: 560px) { .hb-scene { gap: 2px 6px; padding: 16px 4px 8px; } .hb-b { min-width: 0; padding: 4px 6px 6px; } .hb-b canvas { width: 120px; height: 90px; } }

.bv-bg, .bv-bg0 { position: absolute; left: 0; top: 0; image-rendering: pixelated; display: none; }
.bv-cloudwrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; display: none; pointer-events: none; }
.bv-clouds { position: absolute; left: 0; top: 0; image-rendering: pixelated; animation: bvdrift 220s linear infinite; }
@keyframes bvdrift { from { transform: translateX(0); } to { transform: translateX(calc(var(--cw, 1200px) * -1)); } }
#burrowView.has-bg .bv-bg, #burrowView.has-bg .bv-bg0, #burrowView.has-bg .bv-cloudwrap { display: block; }
@media (prefers-reduced-motion: reduce) { .bv-clouds { animation: none; } }

#burrowView { transition: opacity .24s ease; }
.bv-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--ink); font-size: 28px; line-height: 1; pointer-events: auto; backdrop-filter: blur(6px); }

/* the footer lines rest on a soft dark pill so they stay readable over the meadow */
body.scene-on .foot { width: max-content; max-width: min(92%, 520px); margin: 8px auto; padding: 6px 16px; border-radius: 999px; background: rgba(8, 20, 14, .8); color: rgba(236, 246, 238, .95); }

.gapbar { margin: 14px 0 0; } .gapbar .cap { margin: 0 0 8px; } .gaprow { display: flex; gap: 10px; align-items: stretch; max-width: 360px; } .gaprow .inp { flex: 1 1 0; min-width: 0; } .gaprow .btn { flex: 0 0 auto; white-space: nowrap; min-width: 64px; }

/* the burrow panel is always a dark forest, so its words are always light */

.mp-nums { list-style: none; padding: 0; margin: 4px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mp-n { background: var(--field); box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-box); padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }

.mp-proof b { color: var(--ink); font-weight: 600; }
.mp-bad { margin: 8px 4px 0; max-width: 62ch; color: var(--bad); font-weight: 600; }
:root { --bankc: #7b948a; }
.mp-cap { font-size: var(--t-cap); color: var(--ink2); margin: 16px 4px 8px; }
.mp-split, .mp-where { display: flex; gap: 3px; height: 30px; border-radius: 10px; overflow: visible; position: relative; }
.mp-seg, .mp-where i { position: relative; display: block; min-width: 6px; background: var(--c); border-radius: 6px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.16); }

.mp-key { list-style: none; padding: 0; margin: 8px 4px 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--t-micro); color: var(--ink2); }
.mp-key li { display: flex; align-items: center; gap: 6px; }
.mp-key li i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.mp-key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
/* gold coins that fall into a place once, stepped like the rest of the pixel art */
.cd { position: absolute; left: var(--x, 50%); top: 0; width: 15px; height: 15px; margin-left: -7px; background: var(--coin) center / 100% 100% no-repeat; image-rendering: pixelated; opacity: 0; pointer-events: none; z-index: 2; animation: cdrop .9s steps(9) var(--d, 0s) both; }
@keyframes cdrop { 0% { opacity: 1; transform: translateY(-2px); } 80% { opacity: 1; transform: translateY(14px); } 100% { opacity: 0; transform: translateY(18px); } }
.hb-b { position: relative; }
.hb-b .cd { top: 18px; }
.mp-h { font-size: var(--t-h3); font-weight: 500; margin: 20px 4px 10px; }
.hmap .hb-what { margin-bottom: 12px; }
.mp-rooms { margin-top: 0; }
@media (min-width: 720px) { .mp-nums { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* nothing sits straight on the scenery: the Burrows heading and note and the sample-numbers line each get a solid panel (QC gate, 38.29) */
#hBur { background: var(--card); border-radius: var(--r-card); padding: var(--pad-card); margin-top: var(--gap-card); }
#hBur .hb-scene { margin-top: 12px; }
#hBur .hb-note { margin-bottom: 0; }
#hStatus { background: var(--card); border-radius: var(--r-panel); padding: 16px 20px; margin: var(--gap-card) 0 0; }
#hero { background: var(--card); border-radius: var(--r-card); padding: 18px var(--pad-card) 22px; margin-top: var(--gap-card); }
.mp-sample { margin: 0 4px 6px; font-size: var(--t-cap); color: var(--ink); background: var(--track); border-radius: 10px; padding: 8px 12px; }
.mp-sample b { font-weight: 600; }

/* Pay day: the coins fall from the purse into each place */
.mp-act { margin: 12px 4px 0; }
.pdv { position: fixed; inset: 0; z-index: 60; background: #03120b; overflow-y: auto; display: grid; place-items: start center; padding: 24px 14px 40px; }
.pdv[hidden] { display: none; }
body.pdv-on .help-row { display: none; }
.pdv-in { width: min(720px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; }
.pdv h2 { margin: 0; font-size: var(--t-h2); }
.pdv-sub { margin: 0; max-width: 46ch; }
.pdv-stage { position: relative; width: 100%; display: grid; gap: 70px; justify-items: center; padding: 6px 0 10px; }
.pdv-purse { display: grid; justify-items: center; gap: 2px; }
.pdv-purse canvas, .pdv-room canvas { width: 120px; height: 90px; image-rendering: pixelated; }
.pdv-purse b { font-family: var(--fd); font-size: 26px; font-weight: 500; }
.pdv-purse.empty b { opacity: .45; }
.pdv-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 12px; }
.pdv-room { display: grid; justify-items: center; gap: 2px; width: 112px; }
.pdv-room canvas { width: 96px; height: 72px; }
.pdv-n { font-size: var(--t-micro); font-weight: 500; line-height: 1.2; }
.pdv-dot { width: 24px; height: 5px; border-radius: 3px; }
.pdv-a { font-size: var(--t-cap); font-variant-numeric: tabular-nums; font-weight: 600; }
.pdv-coin { position: absolute; left: 0; top: 0; width: 18px; height: 18px; background: center / 100% 100% no-repeat; image-rendering: pixelated; pointer-events: none; z-index: 3; }
.pdv-done { margin: 0; min-height: 3em; max-width: 52ch; color: var(--ink2); font-size: var(--t-cap); }
.pdv-btns { display: flex; gap: 10px; }
@media (max-width: 560px) { .pdv-room { width: 30%; } .pdv-room canvas { width: 84px; height: 63px; } }
.hs-key { margin: 6px 0 0; }
#blankBtn { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.hero-room { display: block; line-height: 0; margin-bottom: 6px; } .hero-room canvas { width: 120px; height: 90px; image-rendering: pixelated; }

/* the header, the tab bars and the Home link sit on solid panels, never straight on the scenery (QC 38.30) */
body.scene-on:not(.scene-phone) .wrap > .top { background: var(--bg); border-radius: 14px; padding: 16px 20px; margin-top: 14px; }
body.scene-on .tabs, body.scene-on .seg { background: color-mix(in srgb, var(--bg) 86%, var(--ink) 14%); }
body.scene-on .plan-top .link { display: inline-block; background: var(--bg); padding: 6px 12px; border-radius: 999px; }
/* the Ask and Help buttons never cover the last lines of a screen */
.wrap { padding-bottom: max(150px, calc(120px + env(safe-area-inset-bottom, 0px))); }
/* the words wrap so the bar and its Undo stay on a 412 wide screen (launch checklist Q7) */
.upd.undo-bar { width: max-content; max-width: min(94vw, 460px); white-space: normal; background: var(--bg) !important; background-image: linear-gradient(var(--float), var(--float)) !important; }   /* solid: page text never shows through (QC10 north-star F5) */ .upd.undo-bar #undoTxt { min-width: 0; flex: 1 1 auto; } .upd.undo-bar #undoGo, .upd.undo-bar #undoX { flex: 0 0 auto; }
/* a recovery code is 28 letters: its box has a line of its own, so the whole code shows as it is typed (Q7) */
.inv-row input#vaultIn, .inv-row input#tourVaultIn { flex: 1 1 100%; min-width: 0; font: 15px ui-monospace, Menlo, Consolas, monospace; padding: 0 10px; letter-spacing: 0; }
body.scene-on .subnav { background: color-mix(in srgb, var(--bg) 86%, var(--ink) 14%); }
/* cards that hold words are solid, so the scenery never shows through behind text (QC 38.30) */
body.scene-on { --panel: color-mix(in srgb, var(--bg) 97%, var(--ink) 3%); --card: color-mix(in srgb, var(--bg) 97%, var(--ink) 3%); }
body.scene-on .card, body.scene-on .why, body.scene-on .gw-card { background: color-mix(in srgb, var(--bg) 96%, var(--ink) 4%); }

/* goal names in the All months table wrap instead of being cut off on a phone */
#monthTable .mt-g { max-width: 100%; height: auto; } #monthTable .mt-g span { white-space: normal; overflow: visible; text-overflow: clip; }
.mp-warn { margin: 6px 4px 10px; padding: 10px 12px; border-radius: 10px; font-size: var(--t-cap); line-height: 1.45; color: var(--ink); background: color-mix(in srgb, var(--bad) 22%, var(--bg)); box-shadow: inset 0 0 0 1px var(--bad); }
@media (max-width: 560px) { #rcCats table { width: 100%; table-layout: fixed; } #rcCats th, #rcCats td { padding: 8px 4px; font-size: 13px; white-space: normal; overflow-wrap: anywhere; } #rcCats th:first-child, #rcCats td:first-child { width: 36%; } }
/* amounts never break inside ("¥123,4" / "56" read as other numbers); only the word "over" may go to the next line (QC round 13 layout blocker 1) */
@media (max-width: 560px) { #rcCats td:not(:first-child) { overflow-wrap: normal; word-break: keep-all; } }
@media (max-width: 360px) { #rcCats th, #rcCats td { padding: 8px 2px; } #rcCats td:not(:first-child) { font-size: 12px; } #rcCats th:first-child, #rcCats td:first-child { width: 28%; } }
.dock { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
.why .why-btns, .why button.close { margin-top: 12px; }

/* QC 38.30: a small solid tag so invented figures are never read as the person's own */
.smp-tag { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line, rgba(0,0,0,.2)); font-size: var(--t-micro); font-weight: 600; color: var(--ink2); letter-spacing: 0; }
/* QC round 8 layout polish 6: a pill never sits alone on a line. The Sample numbers pill on Your burrow uses the space before it as its gap
   (so it fits at 320, and starts at the heading's left edge if it ever wraps) and is lifted to the middle of the heading's line; a
   "planned" pill at the end of a sentence keeps the last word with it */
.hb-h .smp-tag { margin-left: 0; position: relative; top: -3px; }
.ntag-keep { white-space: nowrap; }
.pdv-purse.empty canvas { opacity: .2; }
.tour-chest { display: block; margin: 0 auto 6px; width: 96px; height: 72px; image-rendering: pixelated; }
.gw-card .cap { margin-bottom: 14px; }
.gw-card .row-btns { margin-top: 14px; }
.tour-reveal + p, .tour-chest + .tour-reveal { margin-top: 4px; }

/* ---- version one Home (Mako, 2026-11-18): the picture, the four numbers, one next action; the rest waits behind More ---- */
.v1x { display: none !important; }
.mp-n small { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.mp-n.bad b { color: var(--warn); }   /* amber, never red, for a total below zero (decision 2) */
.mp-pay { margin: 4px 0 0; }
.mp-pay > summary { cursor: pointer; list-style: none; min-height: 44px; display: flex; align-items: center; gap: 8px; margin: 8px 4px 0; }
.mp-pay > summary::-webkit-details-marker { display: none; }
.mp-pay > summary::after { content: 'Show'; white-space: nowrap; flex: none; margin-left: auto; color: var(--acc, var(--ink)); font-weight: 600; font-size: 14px; }
.mp-pay[open] > summary::after { content: 'Hide'; }
.hv1-more { display: block; width: 100%; margin: 4px 0 16px; }   /* the standard button height (look_test: one or two heights only) */
/* text sits on solid panels (QC round 8 layout polish 1): the card colour laid over the page colour, so the words never sit on the forest,
   and a 12px gap from the burrows panel above */
.hv1-more { margin-top: 12px; background: linear-gradient(var(--card), var(--card)), var(--bg); box-shadow: inset 0 0 0 1px var(--hair); }
.hv1-more:hover { background: linear-gradient(var(--track2), var(--track2)), linear-gradient(var(--card), var(--card)), var(--bg); }
/* the four numbers never break inside a number (art director, 38.31 round): one line, a size that fits four across on a laptop */
.mp-four .mp-n b { overflow-wrap: normal; white-space: nowrap; font-size: clamp(20px, 2.1vw + 12px, 28px); }
@media (min-width: 720px) { .mp-four .mp-n b { font-size: clamp(18px, 1.6vw, 26px); } }
/* phones: with the scene on, the cards are already solid (above), so a blur behind them shows nothing but makes the phone redraw it on every frame
   of the animated scene, a known cause of flicker and stutter while scrolling on phones (Mako, 2026-11-18: the mobile version is glitchy) */
body.scene-on .card, body.scene-on .gw-card, body.scene-on .hnext, body.scene-on .src-panel { -webkit-backdrop-filter: none; backdrop-filter: none; }
/* burrow page dots (layout, 38.31 QC round 2): a 44px target for each, every dot visible on dark scenery (a ring), on one solid strip */
.bv-dots { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px); gap: 0; padding: 0 6px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 88%, transparent); }
.bv-dots button { width: 44px; height: 44px; background: none; display: grid; place-items: center; cursor: pointer; }
.bv-dots button::before { content: ''; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 70%, transparent); }   /* --fg is never defined, which hid the old dots */
.bv-dots button[aria-current=true] { background: none; }
.bv-dots button[aria-current=true]::before { background: var(--accent); box-shadow: none; }
.mp-four .mp-n { min-width: 0; overflow: hidden; }
.mp-four .mp-n b { display: block; min-width: 0; }

/* touch targets of at least 44px (38.31 layout rounds 1 to 3). The Plan sub-tabs and links grow to 44px; a switch keeps its look and gets a 44px
   touch area around it. Links inside a sentence keep the line height and get the same invisible touch area. */
.subnav button { min-height: 44px; }
.link { min-height: 44px; }
/* round 4: the link's own box is 44px tall (padding), and an equal negative margin keeps the line where it was, so the touch area is the box itself */
p .link, li .link, span .link, .cap .link { min-height: 0; position: relative; padding-top: 11px; padding-bottom: 11px; margin-top: -11px; margin-bottom: -11px; }
.sw { position: relative; }
.sw::after { content: ''; position: absolute; left: -4px; right: -4px; top: 50%; height: 44px; transform: translateY(-50%); }
/* phones: the Ask and Help pills are smaller, so they cover less of the cards behind them (38.31 QC rounds 2 and 3) */
@media (max-width: 420px) { .help-btn { min-height: 44px; padding: 0 12px 0 6px; font-size: 15px; gap: 6px; } .help-btn .q { width: 28px; height: 28px; font-size: 15px; } }
/* phones: one small round Help button instead of two pills, so less of the page sits under it; Ask stays first in the Help menu (38.31 QC round 4: four reviewers saw the pills cover text) */
@media (max-width: 520px) { #askBtn { display: none; } #helpBtn { font-size: 0; gap: 0; padding: 0 6px; min-width: 44px; justify-content: center; } #helpBtn .q { font-size: 16px; } }
.bv-dots[hidden] { display: none; }
/* the rest of the round 4 list: every control at least 44px in both directions */
#tour summary, details.rem-evt > summary, .rcrem summary { min-height: 44px; display: flex; align-items: center; }
.dp-pick { min-height: 44px; }
#prevM, #nextM { min-width: 44px; }
.amt-in { min-height: 44px; }
.sw { height: 44px; border-radius: 22px; }
.ctext > summary { min-height: 44px; display: flex; align-items: center; }
.link { min-width: 44px; }
/* 320 wide: an open goal editor no longer pushes every goal card into the panel's padding (38.31 layout round 4) */
.gcard { min-width: 0; } .gform, .gform .field, .gform .inp, .gform input, .gform select { min-width: 0; max-width: 100%; }
#djBtn, #gearBtn { min-width: 44px; flex-shrink: 0; }
/* "now" and "planned" on every Home figure (LAUNCH_CHECKLIST A1) */
.ntag { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-style: normal; font-size: var(--t-micro); font-weight: 600; letter-spacing: 0; border: 1px solid var(--line, rgba(0,0,0,.2)); color: var(--ink2); background: transparent; }
.ntag.now { color: var(--ink); border-color: var(--good, currentColor); }
.mp-now { margin: 10px 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line, rgba(0,0,0,.2)); }
.mp-now-h { margin: 0 0 4px; font-weight: 600; }
.mp-now-v { display: block; font-size: 1.6em; line-height: 1.2; }
.mp-now-v.bad { color: var(--bad); }
.mp-now .mp-fresh { margin: 2px 0 6px; }
.mp-ask label { display: block; font-weight: 600; margin: 6px 0 2px; }
.mp-askrow { display: flex; gap: 8px; align-items: stretch; margin-top: 6px; }
.mp-askrow .inp { flex: 1; min-width: 0; }
.mp-askrow .btn, .mp-now .btn, .mp-now .link { min-height: 44px; }
.mp-owe { margin: 6px 0 10px; }
/* F2 (LAUNCH_CHECKLIST, phone check): on screens under 700px tall the page dots sat on the squirrel at the burrow door. There they move to the
   top strip, above the card; and on every screen they step aside while a coin trip runs (the card then shows "Going in." and no buttons) */
@media (max-height: 699px) { .bv-dots { top: max(6px, env(safe-area-inset-top)); bottom: auto; } }
#burrowView:has(.bv-pop:not([hidden]) > .bv-n):not(:has(.bv-pop button)) .bv-dots { visibility: hidden; }
/* F6 (LAUNCH_CHECKLIST, side A finding 1): five controls on Home were under 44px with More open. Each folding summary is 44px tall, and the
   two small links in the status and Free to spend lines get a 44px touch box (the negative margin keeps the line where it was) */
#hQuick .hmore > summary, .hw-more > summary, .gg-wrap > summary { min-height: 44px; display: flex; align-items: center; box-sizing: border-box; }
p.hs-more .link { padding-top: 12px; padding-bottom: 12px; margin-top: -12px; margin-bottom: -12px; }
/* QC round 6 layout 3: Plan > Monthly bills, "Rename, remove or add lines" was 42px tall; 12px above and below makes it 44 */
.cap .link[data-edit] { padding-top: 12px; padding-bottom: 12px; margin-top: -12px; margin-bottom: -12px; }
/* F6: a goal's "full" mark in All months kept the goal colour as 12px text (1.84:1 for the yellow goal in light): the words mix toward the ink */
.mt-g > span { color: color-mix(in srgb, var(--c) 45%, var(--ink)); }
/* A5: the cards in the now block */
.mp-cards { list-style: none; margin: 8px 0 4px; padding: 0; }
.mp-cards li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 0; }
.mp-cards small { color: var(--ink2); }
.mp-cards li > span { min-width: 0; }
.mp-cards li > .link { flex: none; white-space: nowrap; }   /* H1: "Update" broke into two lines on a phone */
.mp-after { margin: 6px 0; }
.mp-after b.bad { color: var(--bad); }
.mp-cardf label { display: block; font-weight: 600; margin: 8px 0 2px; }
.mp-cardf .txt { width: 100%; box-sizing: border-box; min-height: 44px; }

/* the cloud copy steps (LAUNCH_CHECKLIST E15): one panel, one step at a time */
.vault-flow { margin: 10px 0 12px; padding: 14px 14px 12px; border: 1px solid var(--hair); border-radius: 14px; background: var(--track); }
.vault-flow h5 { margin: 0 0 8px; font-size: 16px; line-height: 1.3; outline: none; }
.vault-flow p, .vault-flow li { font-size: 14.5px; line-height: 1.5; margin: 0 0 8px; }
.vault-flow ol { margin: 0 0 8px; padding-left: 22px; }
.vault-flow .row-btns { margin-top: 10px; }
.vf-dots { display: flex; gap: 6px; margin: 0 0 10px; }
.vf-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--track2); }
.vf-dots i.on { background: var(--accent); }
.vf-warn { color: var(--warn); }
.vf-sent { font-weight: 600; }
ol.steps { margin: 4px 0 10px; padding-left: 22px; }
ol.steps li { margin: 0 0 4px; }

/* ---------- H1 walk, finding 11: nothing covers a control or a number (checklist U2) ---------- */
/* phones: Help sits on a solid shelf along the bottom, so it never floats over a card, a tile or a row. The page already ends 150px clear (.wrap) */
@media (max-width: 520px) {
  .help-row::before { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: calc(max(16px, env(safe-area-inset-bottom) + 10px) + 54px); background: var(--bg); box-shadow: 0 -1px 0 var(--hair); z-index: -1; }
}
/* setup: a field that gets the focus scrolls clear of the faded strip above Back and Next */
.tour-scroll { scroll-padding-bottom: 104px; scroll-padding-top: 12px; }
.mp-from { margin-top: 8px; }
/* QC round 4 north-star 2: the Last month table on Receipts fits a phone (it had the 600px table minimum and scrolled sideways with
   nothing to say so), and Plan > All months fits 320 wide with every figure whole and the Status column on screen */
.lbt { min-width: 0; }
@media (max-width: 360px) { #monthTable th, #monthTable td { padding: 10px 2px; font-size: 12px; letter-spacing: -.02em; } #monthTable td:last-child { white-space: normal; } }
/* QC round 4 layout and touch (confusing 1): an amount in "Where your money sits" never breaks inside the number; only the name wraps */
.mp-key b { white-space: nowrap; overflow-wrap: normal; }
.mp-key li { flex-wrap: wrap; min-width: 0; }
/* the Put them back link in Settings is a full tap target (44px) */
#keepBack { min-height: 44px; display: inline-flex; align-items: center; }
/* QC round 4 layout and touch (confusing 1): on phones a control that gets the keyboard focus scrolls clear of the Help shelf along the
   bottom (70px) and of the Plan summary at the top */
@media (max-width: 520px) { html { scroll-padding-bottom: 84px; scroll-padding-top: 64px; } }
/* QC round 4 layout and touch (confusing 2): every one of these is a full 44px tap target */
.hn-b select.inp.sm { min-height: 44px; }
.bv-chips .chip { min-height: 44px; }
.ask-x { width: 44px; height: 44px; }
#tourFull { min-height: 44px; display: inline-flex; align-items: center; }
/* QC round 6 layout and touch 6: a goal name on Home > More wraps to a second line instead of being cut ("Emergenc..." at 320 while
   "21 months" had room); a very long name stops at two lines */
.gd-t b { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; line-height: 1.25; overflow-wrap: normal; }

body .upd.undo-bar.undo-top { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; }   /* over a Log spend button it moves to the top (QC round 11 numbers 1) */
.gw-quick .chipbtn { min-height: 44px; }   /* tap targets 44px (QC round 11 layout 1) */
#monthTable tr[data-ym] > td { height: 44px; }   /* All months rows at 320 were 42px (QC round 11 layout 1) */
.sr-now { position: absolute !important; width: 1px !important; height: 1px !important; min-width: 0 !important; min-height: 0 !important; padding: 0 !important; margin: -1px !important; border: 0 !important; overflow: hidden !important; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }   /* said by the Undo bar already (QC round 11 novice) */
[role="tab"]:focus-visible { outline-offset: -3px; }   /* the ring sits inside the tab, never past the tab bar (QC round 11 layout 3) */
/* app3: slice 1's own page. Built only from the tokens of ../style.css (copied in above by build3.sh). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: var(--t-body); line-height: 1.47; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--aurora); pointer-events: none; }
.a3 { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: var(--gap-card); }
#a3Home { display: flex; flex-direction: column; gap: var(--gap-card); }
.a3-top { display: flex; flex-direction: column; gap: 6px; }
.a3-brand { margin: 8px 0 0; font-family: var(--fd); font-size: var(--t-h3); display: flex; align-items: center; gap: 10px; color: var(--ink2); }
.a3-brand .pix { display: inline-block; }
.a3-day { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--ink); }
.a3-day input { min-height: var(--btn-h-s); border: 0; border-radius: var(--r-ctl-s); background: var(--field); color: var(--ink); font: inherit; padding: 0 10px; box-shadow: inset 0 0 0 1px var(--hair); }
.a3-try { margin: 0; font-size: var(--t-cap); color: var(--warn); background: var(--warn-bg); border-radius: var(--r-ctl-s); padding: 8px 12px; }
.a3-card { background: var(--card); border-radius: var(--r-card); padding: var(--pad-card); box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 var(--glass-hi); }
.a3-card h2 { margin: 0 0 4px; font-size: var(--t-cap); font-weight: 600; letter-spacing: .02em; color: var(--ink2); text-transform: none; }
.a3-big { margin: 0; font-family: var(--fd); font-size: var(--t-h1); line-height: 1.1; font-variant-numeric: tabular-nums; }
